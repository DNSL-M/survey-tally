<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 바깥으로 나가는 요청을 모두 막는다: 붙여넣은 데이터는 이 페이지 안에서만 쓰인다. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; font-src 'none'; connect-src 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>설문 집계기</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1d1d1f; --muted: #5f6368; --bg: #ffffff; --line: #d0d4d9; --head: #f2f4f7; --accent: #1a5fb4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e8eaed; --muted: #a0a6ad; --bg: #16181b; --line: #3a3f45; --head: #22262b; --accent: #78aeed; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .lead, .note { color: var(--muted); margin: 0 0 16px; }
  .note { font-size: .875rem; margin-top: 20px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  textarea {
    width: 100%; min-height: 200px; padding: 10px; resize: vertical;
    font: .875rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; tab-size: 8;
  }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions { display: flex; gap: 8px; margin: 10px 0 24px; }
  button {
    font: inherit; padding: 6px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--head); color: var(--fg);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  #status { margin: 0 0 8px; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { border: 1px solid var(--line); padding: 6px 10px; }
  thead th { background: var(--head); text-align: center; white-space: nowrap; }
  td { text-align: right; }
  td:first-child { text-align: left; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<main>
  <h1>설문 집계기</h1>
  <p class="lead">엑셀에서 머리글 줄까지 복사해 아래에 붙여넣으면 문항별 결과가 나옵니다.</p>

  <label for="input">응답 데이터</label>
  <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"
    placeholder="응답번호&#9;문항1&#9;문항2&#10;1&#9;5&#9;4&#10;2&#9;3&#9;"></textarea>
  <div class="actions">
    <button type="button" id="run" class="primary">집계</button>
    <button type="button" id="clear">지우기</button>
  </div>

  <p id="status" role="status" aria-live="polite"></p>
  <div class="table-wrap">
    <table id="result" hidden>
      <thead>
        <tr><th scope="col">문항</th><th scope="col">유효 응답</th><th scope="col">평균</th><th scope="col">빈 응답</th><th scope="col">제외</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <p class="note">
    첫 열(응답번호)은 집계하지 않습니다. 앞뒤 공백을 지운 값이 1~5이면 유효, 비었거나 공백만 있으면 빈 응답,
    그 밖의 값은 제외로 셉니다. 칸이 모자란 줄은 모자란 칸을 빈 응답으로 셉니다.
    평균은 소수 셋째 자리에서 반올림합니다.<br>
    붙여넣은 데이터는 이 브라우저 안에서만 계산되며 어디로도 보내거나 저장하지 않습니다.
  </p>
</main>
<script id="tally-core">
// 계산 로직: 화면(DOM)과 무관한 순수 함수만 둔다. tests/core.test.js가 이 블록을 꺼내 시험한다.
var SurveyTally = (function () {
  "use strict";

  // 엑셀 복사 형식(탭 구분, 줄바꿈 줄 구분, 큰따옴표 칸)을 칸 배열의 배열로 바꾼다.
  function parseTSV(text) {
    var rows = [];
    var row = [];
    var i = 0;
    var n = text.length;

    while (i <= n) {
      var field = null;
      if (text.charAt(i) === '"') {
        // 따옴표 칸: 닫는 따옴표 다음이 탭/줄바꿈/끝이어야 한다.
        var j = i + 1;
        var buf = "";
        var closed = false;
        while (j < n) {
          var ch = text.charAt(j);
          if (ch === '"') {
            if (text.charAt(j + 1) === '"') { buf += '"'; j += 2; continue; }
            closed = true;
            j += 1;
            break;
          }
          buf += ch;
          j += 1;
        }
        if (closed) {
          // 닫는 따옴표 뒤에 남은 글자가 있으면 그대로 붙인다(엑셀은 만들지 않는 형식).
          var k = j;
          while (k < n && !isBreak(text, k)) k += 1;
          field = buf + text.slice(j, k);
          i = k;
        }
        // 닫히지 않은 따옴표면 field가 null로 남아 아래에서 보통 칸으로 읽는다.
      }
      if (field === null) {
        var e = i;
        while (e < n && !isBreak(text, e)) e += 1;
        field = text.slice(i, e);
        i = e;
      }
      row.push(field);

      if (i >= n) { rows.push(row); break; }
      var c = text.charAt(i);
      if (c === "\t") { i += 1; continue; }
      // 줄바꿈: \r\n, \n, \r
      if (c === "\r" && text.charAt(i + 1) === "\n") i += 2; else i += 1;
      rows.push(row);
      row = [];
      if (i === n) break; // 마지막 줄바꿈 뒤에는 줄이 없다.
    }
    return rows;
  }

  function isBreak(text, idx) {
    var c = text.charAt(idx);
    return c === "\t" || c === "\n" || c === "\r";
  }

  function isEmptyLine(row) {
    return row.length === 1 && row[0] === "";
  }

  // 칸 하나를 "valid" / "blank" / "excluded"로 판정한다.
  function classifyCell(value) {
    var v = value === undefined || value === null ? "" : String(value).trim();
    if (v === "") return { kind: "blank" };
    if (v === "1" || v === "2" || v === "3" || v === "4" || v === "5") {
      return { kind: "valid", score: Number(v) };
    }
    return { kind: "excluded" };
  }

  // 합 ÷ 수를 소수 셋째 자리에서 반올림해 둘째 자리까지. 정수 연산으로 오차 없이 계산한다.
  function formatAverage(sum, count) {
    if (!count) return "-";
    var hundredths = Math.floor((200 * sum + count) / (2 * count));
    var whole = Math.floor(hundredths / 100);
    var frac = hundredths % 100;
    return whole + "." + (frac < 10 ? "0" : "") + frac;
  }

  // 붙여넣은 글 전체를 받아 문항별 결과를 돌려준다.
  function tally(text) {
    var rows = parseTSV(String(text === undefined || text === null ? "" : text))
      .filter(function (r) { return !isEmptyLine(r); });

    if (rows.length === 0) return { error: "empty", questions: [], respondents: 0 };

    var header = rows[0];
    if (header.length < 2) return { error: "no-questions", questions: [], respondents: rows.length - 1 };

    var questions = [];
    for (var col = 1; col < header.length; col += 1) {
      var name = header[col].trim();
      questions.push({
        name: name === "" ? "(이름 없음, " + (col + 1) + "열)" : name,
        column: col + 1,
        valid: 0,
        sum: 0,
        blank: 0,
        excluded: 0,
        average: "-"
      });
    }

    for (var r = 1; r < rows.length; r += 1) {
      var cells = rows[r];
      for (var q = 0; q < questions.length; q += 1) {
        var result = classifyCell(cells[q + 1]); // 모자란 칸은 undefined → 빈 응답
        var item = questions[q];
        if (result.kind === "valid") { item.valid += 1; item.sum += result.score; }
        else if (result.kind === "blank") item.blank += 1;
        else item.excluded += 1;
      }
    }

    questions.forEach(function (item) { item.average = formatAverage(item.sum, item.valid); });
    return { error: null, questions: questions, respondents: rows.length - 1 };
  }

  return { parseTSV: parseTSV, classifyCell: classifyCell, formatAverage: formatAverage, tally: tally };
})();
</script>
<script id="tally-ui">
// 화면 연결: 입력을 읽어 SurveyTally.tally에 넘기고 결과를 표로 그린다. 값은 모두 textContent로 넣는다.
(function () {
  "use strict";
  var input = document.getElementById("input");
  var status = document.getElementById("status");
  var table = document.getElementById("result");
  var tbody = table.querySelector("tbody");

  function render() {
    var result = SurveyTally.tally(input.value);
    tbody.textContent = "";

    if (result.error === "empty") {
      table.hidden = true;
      status.textContent = input.value === "" ? "" : "붙여넣은 내용이 비어 있습니다.";
      return;
    }
    if (result.error === "no-questions") {
      table.hidden = true;
      status.textContent = "문항 열이 없습니다. 머리글 줄에 응답번호 열 다음으로 문항이 있어야 합니다.";
      return;
    }

    result.questions.forEach(function (q) {
      var tr = document.createElement("tr");
      [q.name, q.valid, q.average, q.blank, q.excluded].forEach(function (v) {
        var td = document.createElement("td");
        td.textContent = String(v);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.hidden = false;
    status.textContent = "응답 " + result.respondents + "줄, 문항 " + result.questions.length + "개를 집계했습니다.";
  }

  input.addEventListener("input", render);
  document.getElementById("run").addEventListener("click", render);
  document.getElementById("clear").addEventListener("click", function () {
    input.value = "";
    render();
    input.focus();
  });
  render();
})();
</script>
</body>
</html>
